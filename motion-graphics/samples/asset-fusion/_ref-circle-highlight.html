<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>asset-fusion · circle-highlight TEMPLATE (drop-in)</title>
    <!-- ============================================================
         DROP-IN circle-highlight (editorial amber annotation style). To reuse:
           1) set CFG below (asset path, EVEN stage dims, BOX from the locate protocol, LABEL)
           2) render with even width/height (ODD width => ffmpeg encode fails!)
         BOX comes from grounding/PROTOCOL.md (locate.mjs loop) — NEVER eyeball coords.
         Everything (wash pool, double ring, connector, callout, brackets) is
         computed from BOX. Set MODE='full' (ring+label+brackets) or 'circle'
         (ring only). Gotchas are flagged inline.
         ============================================================ -->
    <style>
      :root {
        --ink: #0a0c10;
        --amber: #f2c078;
        --paper: #f5efe6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
        background: var(--ink);
      }
      #stage {
        position: relative;
        overflow: hidden;
        background: #fff;
        font-family: "Inter", -apple-system, system-ui, sans-serif;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      #shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        z-index: 0;
      }
      #wash {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #ann {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        overflow: visible;
      }
      #ring-a,
      #ring-b,
      #conn {
        stroke: var(--amber);
        fill: none;
        stroke-linecap: round;
      }
      #ring-a {
        stroke-width: 8;
        filter: drop-shadow(0 0 12px rgba(242, 192, 120, 0.5));
      }
      #ring-b {
        stroke-width: 5;
        opacity: 0.85;
      }
      #conn {
        stroke-width: 5;
      }
      #callout {
        position: absolute;
        z-index: 4;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 15px 28px;
        background: var(--ink);
        border: 2px solid var(--amber);
        border-radius: 999px;
        box-shadow: 0 14px 40px rgba(8, 9, 12, 0.6);
        transform-origin: left center;
      }
      #callout .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--amber);
      }
      #callout .label {
        font-size: 33px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--paper);
        text-transform: uppercase;
        white-space: nowrap;
      }
      .tick {
        position: absolute;
        z-index: 5;
        width: 56px;
        height: 56px;
        border: 3px solid var(--paper);
        opacity: 0.55;
      }
      .tick.tl {
        top: 44px;
        left: 44px;
        border-right: none;
        border-bottom: none;
      }
      .tick.tr {
        top: 44px;
        right: 44px;
        border-left: none;
        border-bottom: none;
      }
      .tick.bl {
        bottom: 44px;
        left: 44px;
        border-right: none;
        border-top: none;
      }
      .tick.br {
        bottom: 44px;
        right: 44px;
        border-left: none;
        border-top: none;
      }
      #scan {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        mix-blend-mode: overlay;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.04) 0,
          rgba(255, 255, 255, 0.04) 2px,
          transparent 2px,
          transparent 4px
        );
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="circle-highlight" data-start="0" data-duration="6.5" data-fps="30" data-width="1400" data-height="932">
      <!-- CONFIG: set these values -->
      <!-- ASSET: path to frozen project-local image -->
      <!-- BOX: [x0, y0, x1, y1] normalized coordinates from locate protocol -->
      <!-- LABEL: text for callout -->
      <!-- MODE: 'full' or 'circle' -->
      <img id="shot" src="assets/your-asset.png" />
      <svg id="wash" viewBox="0 0 1400 932">
        <radialGradient id="wash-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(20,20,24,0.85)" />
          <stop offset="100%" stop-color="rgba(20,20,24,0.25)" />
        </radialGradient>
        <rect width="1400" height="932" fill="url(#wash-grad)" />
      </svg>
      <svg id="ann" viewBox="0 0 1400 932">
        <ellipse id="ring-a" cx="700" cy="466" rx="150" ry="150" />
        <ellipse id="ring-b" cx="700" cy="466" rx="130" ry="130" />
        <path id="conn" d="M 850 350 C 900 300 1000 350 1000 400" />
      </svg>
      <div id="callout" style="left: 850px; top: 300px;">
        <div class="dot"></div>
        <div class="label">LABEL</div>
      </div>
      <div class="tick tl"></div>
      <div class="tick tr"></div>
      <div class="tick bl"></div>
      <div class="tick br"></div>
      <div id="scan"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      // ====== CONFIGURATION ======
      const CFG = {
        asset: "assets/your-asset.png",
        W: 1400, // MUST be EVEN
        H: 932, // MUST be EVEN
        box: [0.4, 0.35, 0.6, 0.55], // [x0, y0, x1, y1] from locate protocol
        label: "Highlighted Item",
        mode: "full", // or "circle"
      };

      // ====== INITIALIZATION ======
      const S = document.getElementById("stage");
      const ra = document.getElementById("ring-a");
      const rb = document.getElementById("ring-b");
      const im = document.getElementById("shot");

      im.src = CFG.asset;
      im.onload = () => {
        // Compute ellipse from box
        const cx = ((CFG.box[0] + CFG.box[2]) / 2) * CFG.W;
        const cy = ((CFG.box[1] + CFG.box[3]) / 2) * CFG.H;
        const rxA = ((CFG.box[2] - CFG.box[0]) / 2) * CFG.W;
        const ryA = ((CFG.box[3] - CFG.box[1]) / 2) * CFG.H;

        ra.setAttribute("cx", cx);
        ra.setAttribute("cy", cy);
        ra.setAttribute("rx", rxA);
        ra.setAttribute("ry", ryA);
        ra.setAttribute("transform", `rotate(-4 ${cx} ${cy})`);
        rb.setAttribute("cx", cx);
        rb.setAttribute("cy", cy);
        rb.setAttribute("rx", rxA - 20);
        rb.setAttribute("ry", ryA - 16);
        rb.setAttribute("transform", `rotate(3 ${cx} ${cy})`);

        // callout position
        const right = cx < CFG.W * 0.62;
        const co = document.getElementById("callout");
        co.querySelector(".label").textContent = CFG.label;
        const coX = right ? Math.min(cx + rxA + 10, CFG.W - 360) : Math.max(cx - rxA - 360, 30);
        const coY = Math.max(cy - ryA - 60, 40);
        co.style.left = coX + "px";
        co.style.top = coY + "px";

        conn.setAttribute(
          "d",
          `M ${cx + rxA * 0.75} ${cy - ryA * 0.7} C ${(cx + rxA * 0.75 + coX) / 2} ${cy - ryA * 0.7 - 50}, ${coX - 20} ${coY + 70}, ${coX + 2} ${coY + 26}`,
        );

        // Timeline
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const lenA = ra.getTotalLength() || 1900;
        const lenB = rb.getTotalLength() || 1750;
        const lenC = conn.getTotalLength() || 220;

        gsap.set("#wash", { autoAlpha: 0 });
        gsap.set(ra, { strokeDasharray: lenA, strokeDashoffset: lenA, autoAlpha: 0 });
        gsap.set(rb, { strokeDasharray: lenB, strokeDashoffset: lenB, autoAlpha: 0 });
        gsap.set(conn, { strokeDasharray: lenC, strokeDashoffset: lenC, autoAlpha: 0 });
        gsap.set("#callout", { autoAlpha: 0, scale: 0.6 });
        gsap.set("#scan", { autoAlpha: 0 });
        gsap.set(".tick", { autoAlpha: 0 });

        tl.to("#wash", { autoAlpha: 1, duration: 0.9, ease: "power2.out" }, 0.6);
        if (CFG.mode === "full") {
          tl.to("#scan", { autoAlpha: 1, duration: 0.8 }, 0.7);
          tl.to(".tick", { autoAlpha: 0.55, duration: 0.5, stagger: 0.06 }, 0.8);
        }
        tl.to(ra, { autoAlpha: 1, duration: 0.08 }, 1.3);
        tl.to(ra, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 1.3);
        tl.to(rb, { autoAlpha: 1, duration: 0.08 }, 1.68);
        tl.to(rb, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 1.68);
        if (CFG.mode === "full") {
          tl.to(conn, { autoAlpha: 1, duration: 0.05 }, 2.55);
          tl.to(conn, { strokeDashoffset: 0, duration: 0.35, ease: "power3.out" }, 2.6);
          tl.to("#callout", { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 2.95);
        }
        window.__timelines["circle-highlight"] = tl;
        tl.seek(0);
      };
    </script>
  </body>
</html>
